<!-- Botón flotante de carrito -->
<!-- Modal de confirmación para vaciar carrito -->
<app-confirm-modal
  [(visible)]="showConfirmModal"
  title="Vaciar carrito"
  [message]="confirmMessage"
  confirmText="Vaciar"
  cancelText="Cancelar"
  confirmType="danger"
  (onConfirm)="confirmClearCart()"
></app-confirm-modal>

<div class="cart-floating-button" (click)="toggleCart()">
    <div class="cart-button-content">
      <div class="cart-text">Carrito</div>
      <div *ngIf="cartItemCount > 0" class="cart-count">{{ cartItemCount }}</div>
      <div class="cart-amount">{{ formatPrice(cartTotal) }}</div>
    </div>
  </div>
  
  <!-- Vista detalle del carrito -->
  <div class="cart-detail" [class.show-cart]="showCart" (click)="$event.stopPropagation()">
    <div class="cart-header">
      <div class="cart-title">DETALLES DEL PEDIDO</div>
      <button class="close-cart" (click)="showCart = false; $event.stopPropagation()">×</button>
    </div>
    
    <!-- Botón para vaciar carrito -->
    <div class="clear-cart-action" *ngIf="cartItems.length > 0">
      <button class="clear-cart-btn" (click)="clearCart($event)" title="Vaciar carrito">
        <i class="fas fa-trash"></i> Vaciar todo
      </button>
    </div>
    <div class="cart-items" *ngIf="cartItems.length > 0">
      <div class="cart-item" *ngFor="let item of cartItems">
        <!-- Botón para eliminar producto completo -->
        <button class="delete-item-btn" (click)="removeFromCart(item.product.id, $event)" title="Eliminar producto">
          <span>&times;</span>
        </button>
        <div class="item-image">
          <img [src]="item.product.image" [alt]="item.product.name">
        </div>
        <div class="item-info">
          <div class="item-name">{{ item.product.name }}</div>
          <div class="item-price">{{ formatPrice(getPrice(item)) }}</div>
        </div>
        <div class="item-quantity">
          <button class="quantity-btn" (click)="decreaseQuantity(item.product.id, $event)">-</button>
          <span class="quantity">{{ item.quantity }}</span>
          <button class="quantity-btn" (click)="increaseQuantity(item.product, $event)">+</button>
        </div>
        <div class="item-total">{{ formatPrice(getPrice(item) * item.quantity) }}</div>
      </div>
    </div>
    <div class="cart-empty" *ngIf="cartItems.length === 0">
      <div class="empty-message">Tu carrito está vacío</div>
      <button class="continue-btn" (click)="showCart = false; $event.stopPropagation()">Seguir comprando</button>
    </div>
    <div class="cart-footer" *ngIf="cartItems.length > 0">
      <div class="cart-total-row">
        <span>Total:</span>
        <span class="total-amount">{{ formatPrice(cartTotal) }}</span>
      </div>
      <button class="checkout-btn" (click)="goToCheckout(); $event.stopPropagation()">COMPLETAR PEDIDO</button>
    </div>
  </div>
