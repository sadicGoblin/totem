<!-- Área invisible en la esquina superior derecha para activar el diálogo -->
<div class="admin-trigger" (click)="toggleDialog()"></div>

<!-- Modal de autenticación para administradores -->
<div *ngIf="showDialog" class="admin-modal-overlay" (click)="toggleDialog()">
  <div class="admin-modal" (click)="stopPropagation($event)">
    <h2>Acceso Administrativo</h2>
    
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input 
        type="password" 
        id="password" 
        [(ngModel)]="password" 
        placeholder="Ingrese la contraseña"
        (keyup.enter)="submitPassword()"
        autofocus
      >
      
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </div>
    
    <div class="button-group">
      <button class="cancel-btn" (click)="toggleDialog()">Cancelar</button>
      <button class="submit-btn" (click)="submitPassword()">Aceptar</button>
    </div>
  </div>
</div>
