<!-- Componente compartido del carrito flotante -->
<app-cart-floating></app-cart-floating>

<div class="category-container">
  <div class="category-header">
    <div class="header-content">
      <h1>¿Qué estás buscando hoy?</h1>
      <p>Explora nuestros productos y servicios</p>
    </div>
    <div class="entel-logo">
      <img src="https://pdv-entel.web.app/assets/resources/Recurso1@3x.png" alt="Entel Logo" />
    </div>
  </div>

  <div class="category-selection">
    <!-- <h2>Selecciona una categoría</h2> -->

    <!-- Loading spinner -->
    <div *ngIf="isLoading" class="loading-container">
      <div class="loading-spinner">Cargando categorías...</div>
    </div>

    <!-- Categories grid -->
    <div *ngIf="!isLoading" class="category-grid">
      <div 
        *ngFor="let category of categories" 
        class="category-card" 
        (click)="selectCategory(category.slug)"
      >
        <div class="card-image">
          <img
            [src]="category.image"
            [alt]="category.name"
            (error)="onImageError($event, category.name)"
          />
        </div>
        <div class="card-content">
          <div class="card-title">{{ category.name }}</div>
          <div class="card-description" [innerHTML]="category.description"></div>
        </div>
      </div>
    </div>

    <!-- Error message -->
    <div *ngIf="!isLoading && categories.length === 0" class="no-categories">
      <p>No se pudieron cargar las categorías. Por favor, intenta más tarde.</p>
    </div>
  </div>
</div>
