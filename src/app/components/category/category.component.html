<!-- Componente compartido del carrito flotante -->
<app-cart-floating></app-cart-floating>

<div class="category-container">
  <div class="category-header">
    <div class="header-content">
      <h1>¿Qué estás buscando hoy?</h1>
      <p>Explora nuestros productos y servicios</p>
    </div>
    <div class="entel-logo">
      <img src="https://storage.googleapis.com/liquidos-public/Isologo_R_crop.png" alt="Entel Logo" />
    </div>
  </div>

  <div class="category-selection">
    <!-- <h2>Selecciona una categoría</h2> -->

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-container">
      <div class="loading-spinner"></div>
      <p>Cargando categorías...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-container">
      <p>Error al cargar las categorías. Por favor, intenta nuevamente.</p>
      <button (click)="loadCategories()" class="retry-button">Reintentar</button>
    </div>

    <!-- Categories Grid -->
    <div class="category-grid" *ngIf="!loading && !error">
      <div 
        class="category-card" 
        *ngFor="let category of categories; trackBy: trackByCategory"
        (click)="selectCategory(category)"
      >
        <div class="card-image">
          <img
            [src]="category.image"
            [alt]="category.name"
            (error)="onImageError($event, category)"
          />
        </div>
        <div class="card-content">
          <div class="card-title">{{ category.name.toUpperCase() }}</div>
          <div class="card-description">{{ category.description }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
