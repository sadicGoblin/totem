<div class="payment-bar">
  <button class="back-btn" (click)="goBack()">
    <span>&larr;</span> OLVIDÉ ALGO
  </button>
  <h1>Pago con Tarjeta</h1>
  <div class="spacer"></div>
  <div class="store-logo" *ngIf="storeLogo">
    <img [src]="storeLogo" alt="Store Logo" />
  </div>
</div>

<div class="payment-container">
  <div class="payment-content">
    <div class="payment-summary-card">
      <h2>Resumen de tu pedido</h2>
      <div class="summary-row">
        <span>Productos:</span>
        <strong>{{ totalItems }}</strong>
      </div>
      <div class="summary-row total">
        <span>Total:</span>
        <strong>{{ formatPrice(cartTotal) }}</strong>
      </div>

    </div>

    <div class="payment-processing-card" *ngIf="processingPayment">
      <div class="payment-icon">
        <i class="fas fa-credit-card"></i>
      </div>
      <h2>Procesando pago</h2>
      <p class="payment-instruction">Inserta o acerca tu tarjeta en el terminal</p>
      <div class="loader">
        <div class="loader-bar"></div>
      </div>
      <p class="payment-message">{{ paymentStatusMessage }}</p>
      <button class="cancel-payment-btn" (click)="cancelCardPayment()">
        CANCELAR
      </button>
    </div>
  </div>
</div>
