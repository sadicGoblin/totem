<div class="welcome-container" (click)="navigateToCatalog()">
  <!-- Contenido principal -->
  <div class="welcome-content">
    <!-- Logo de Papa John's -->
    <div class="logo-container">
      <img class="papa-johns-logo" src="assets/images/papa-johns-logo.png" alt="Papa John's" onerror="this.style.display='none';">
    </div>
    
    <!-- Mascota de Papa John's (tomate) -->
    <div class="mascot-container">
      <img class="papa-johns-mascot" [src]="currentMascotImage" alt="Papa John's Mascot" onerror="this.style.display='none';">
    </div>
    
    <!-- Botón principal -->
    <button class="order-button" (click)="navigateToCatalog()">
      ORDENA AQUÍ
    </button>
    
    <!-- Texto inferior -->
    <p class="touch-text">PRESIONA LA PANTALLA</p>
  </div>
</div>
