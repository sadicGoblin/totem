<div class="welcome-container" (click)="navigateToCatalog()">
  <!-- Video de fondo dinámico desde playlist -->
  <video 
    #videoPlayer
    autoplay 
    muted 
    playsinline 
    preload="auto"
    class="background-video"
    [src]="currentVideoUrl"
    (ended)="onVideoEnded()"
    (canplay)="onVideoCanPlay()"
    (error)="onVideoError()">
    <!-- Mensaje de fallback si el navegador no soporta video -->
    Tu navegador no soporta videos HTML5.
  </video>
</div>
