<!-- Componente compartido del carrito flotante -->
<app-cart-floating></app-cart-floating>

<!-- Barra de navegación superior (solo visible cuando venimos de categorías) -->
<div class="top-nav-bar" *ngIf="hideNavButtons">
  <button class="back-button" (click)="goBackToCategories()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
  </button>
  <div class="current-category">{{ selectedCategory || 'TODOS LOS PRODUCTOS' }}</div>
  <div class="entel-logo">
    <img src="https://storage.googleapis.com/liquidos-public/Isologo_R_crop.png" alt="Entel Logo" />
  </div>
</div>

<!-- Barra de subcategorías (solo para TELEFONIA) -->
<div class="subcategory-bar" *ngIf="shouldShowSubcategories()">
  <div class="subcategory-buttons">
    <button 
      class="subcategory-btn" 
      [class.active]="selectedSubcategory === 'PLANES'"
      (click)="setSubcategory('PLANES')">
      PLANES
    </button>
    <button 
      class="subcategory-btn" 
      [class.active]="selectedSubcategory === 'EQUIPOS'"
      (click)="setSubcategory('EQUIPOS')">
      EQUIPOS
    </button>
  </div>
</div>

<div class="main-container">
  <!-- Main content area with products grid -->
  <div class="content-area">
    <div class="products-grid">
      <div class="product-card" *ngFor="let product of getFilteredProducts()">
        <!-- Special tag -->
        <div class="special-tag" *ngIf="product.specialTag">
          {{ product.specialTag }}
        </div>
        
        <!-- Discount tag -->
        <div class="discount-tag" *ngIf="product.discount">
          <span class="tag-icon">Oferta</span>
        </div>

        <!-- Product image (clickeable) -->
        <div class="product-image" (click)="openProductModal(product)">
          <img [src]="product.image" [alt]="product.name" />
        </div>

        <!-- Product info -->
        <div class="product-info">
          <div class="product-name">{{ product.name }}</div>
          <div class="product-description">{{ product.description }}</div>
          <div class="product-price">
            <span class="current-price">{{ formatPrice(product.price) }}</span>
            <span class="original-price" *ngIf="product.originalPrice">
              {{ formatPrice(product.originalPrice) }}
            </span>
          </div>
        </div>
        
        <!-- Add to cart buttons with quantity control -->
        <div class="cart-controls">
          <!-- Si no hay productos en el carrito, mostrar botón simple de añadir -->
          <button 
            class="add-to-cart-btn" 
            (click)="addToCart(product)" 
            *ngIf="getItemQuantityInCart(product.id) === 0">
            <span class="btn-text">Agregar</span>
            <span class="btn-icon">+</span>
          </button>
          
          <!-- Si ya hay productos, mostrar controles de cantidad -->
          <div class="quantity-controls" *ngIf="getItemQuantityInCart(product.id) > 0">
            <button class="quantity-btn decrease" (click)="decreaseQuantity(product)">
              <span>-</span>
            </button>
            <div class="quantity-display">
              {{ getItemQuantityInCart(product.id) }}
            </div>
            <button class="quantity-btn increase" (click)="addToCart(product)">
              <span>+</span>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Elemento fantasma para reservar espacio y evitar que el carrito flotante oculte productos -->
      <div class="product-card cart-spacer"></div>
    </div>
  </div>
</div>

<!-- Modal para detalles del producto -->
<app-modal
  [product]="selectedProduct"
  [isOpen]="showModal"
  [initialQuantity]="selectedProduct ? getItemQuantityInCart(selectedProduct.id) : 0"
  (close)="closeModal()"
  (addToCart)="handleAddToCartFromModal($event)"
></app-modal>
