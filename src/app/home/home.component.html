<!-- Componente compartido del carrito flotante -->
<app-cart-floating></app-cart-floating>

<!-- Header con logo -->
<div class="top-header" [ngStyle]="{
  'background': homeTheme.header.background,
  'padding': homeTheme.header.padding
}">
  <div class="store-logo" *ngIf="storeLogo">
    <img [src]="storeLogo" alt="Logo" [ngStyle]="{ 'height': homeTheme.header.logo.height }" />
  </div>
</div>

<!-- Slides promocionales -->
<div class="promo-slides" *ngIf="slides.length > 0" [ngStyle]="{
  'height': homeTheme.promoSlides.height,
  'background-color': homeTheme.promoSlides.backgroundColor
}">
  <div class="slides-container">
    <div 
      class="slide-item" 
      *ngFor="let slide of slides; let i = index"
      [class.active]="i === currentSlideIndex"
      (click)="onSlideClick(slide)">
      <img [src]="slide.image" [alt]="slide.name" />
      <!-- <div class="slide-content" *ngIf="slide.name || slide.description">
        <h3>{{ slide.name }}</h3>
        <p *ngIf="slide.description">{{ slide.description }}</p>
        <span class="slide-btn" *ngIf="slide.button_text">{{ slide.button_text }}</span>
      </div> -->
    </div>
  </div>
  <div class="slide-indicators" *ngIf="slides.length > 1">
    <span 
      *ngFor="let slide of slides; let i = index" 
      class="indicator" 
      [class.active]="i === currentSlideIndex"
      (click)="goToSlide(i)">
    </span>
  </div>
</div>

<div class="main-layout">
  <!-- Sidebar de categorías -->
  <aside class="categories-sidebar" [ngStyle]="{
    'width': homeTheme.sidebar.width,
    'background-color': homeTheme.sidebar.backgroundColor,
    'border-color': homeTheme.sidebar.borderColor
  }">
    <div class="sidebar-title" [ngStyle]="{
      'color': homeTheme.sidebar.title.color,
      'font-size': homeTheme.sidebar.title.fontSize,
      'font-weight': homeTheme.sidebar.title.fontWeight
    }">Categorías</div>
    
    <!-- Opción "Todos" -->
    <div 
      class="category-item" 
      [class.active]="selectedCategoryId === null"
      (click)="selectCategory(null)">
      <div class="category-icon all-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 6h4v4H4V6zm6 0h4v4h-4V6zm6 0h4v4h-4V6zM4 12h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 18h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
        </svg>
      </div>
      <span class="category-name">Todos</span>
    </div>
    
    <!-- Categorías dinámicas -->
    <div 
      class="category-item" 
      *ngFor="let category of categories"
      [class.active]="selectedCategoryId === category.id"
      (click)="selectCategory(category.id)">
      <div class="category-icon">
        <img 
          *ngIf="category.image || category.icon_file" 
          [src]="category.icon_file || category.image" 
          [alt]="category.name" />
        <span *ngIf="!category.image && !category.icon_file" class="category-initial">
          {{ category.name.charAt(0) }}
        </span>
      </div>
      <span class="category-name">{{ category.name }}</span>
    </div>
  </aside>

  <!-- Contenido principal con productos -->
  <main class="products-main" [ngStyle]="{
    'background-color': homeTheme.productsMain.backgroundColor,
    'padding': homeTheme.productsMain.padding
  }">
<!-- <div class="section-header">
      <h2>{{ selectedCategory || 'Todos los productos' }}</h2>
      <span class="product-count">{{ getFilteredProducts().length }} productos</span>
    </div> -->
    
    <div class="products-grid">
      <div class="product-card" *ngFor="let product of getFilteredProducts()" [ngStyle]="{
        'background-color': homeTheme.productCard.backgroundColor,
        'border-radius': homeTheme.productCard.borderRadius,
        'border-color': homeTheme.productCard.borderColor
      }">
        <!-- Special tag -->
        <div class="special-tag" *ngIf="product.specialTag" [ngStyle]="{
          'background-color': homeTheme.productCard.specialTag.backgroundColor,
          'color': homeTheme.productCard.specialTag.textColor,
          'font-size': homeTheme.productCard.specialTag.fontSize
        }">
          {{ product.specialTag }}
        </div>
        
        <!-- Discount tag -->
        <div class="discount-tag" *ngIf="product.discount" [ngStyle]="{
          'background-color': homeTheme.productCard.discountTag.backgroundColor,
          'color': homeTheme.productCard.discountTag.textColor,
          'font-size': homeTheme.productCard.discountTag.fontSize
        }">
          <span class="tag-icon">-{{ product.discount }}%</span>
        </div>

        <!-- Product image (clickeable) -->
        <div class="product-image" (click)="openProductModal(product)" [ngStyle]="{
          'height': homeTheme.productCard.imageHeight
        }">
          <img [src]="product.image" [alt]="product.name" />
        </div>

        <!-- Product info -->
        <div class="product-info">
          <div class="product-name" [ngStyle]="{
            'color': homeTheme.productCard.name.color,
            'font-size': homeTheme.productCard.name.fontSize,
            'font-weight': homeTheme.productCard.name.fontWeight
          }">{{ product.name }}</div>
          <div class="product-description" [ngStyle]="{
            'color': homeTheme.productCard.description.color,
            'font-size': homeTheme.productCard.description.fontSize
          }" [innerHTML]="product.description"></div>
          <div class="product-price">
            <span class="current-price" [ngStyle]="{
              'color': homeTheme.productCard.price.currentColor,
              'font-size': homeTheme.productCard.price.currentSize
            }">{{ formatPrice(product.price) }}</span>
            <span class="original-price" *ngIf="product.originalPrice" [ngStyle]="{
              'color': homeTheme.productCard.price.originalColor,
              'font-size': homeTheme.productCard.price.originalSize
            }">
              {{ formatPrice(product.originalPrice) }}
            </span>
          </div>
        </div>
        
        <!-- Add to cart buttons with quantity control -->
        <div class="cart-controls">
          <button 
            class="add-to-cart-btn" 
            (click)="addToCart(product)" 
            *ngIf="getItemQuantityInCart(product.id) === 0"
            [ngStyle]="{
              'background-color': homeTheme.productCard.addToCartButton.backgroundColor,
              'color': homeTheme.productCard.addToCartButton.textColor,
              'font-size': homeTheme.productCard.addToCartButton.fontSize,
              'height': homeTheme.productCard.addToCartButton.height,
              'border-radius': homeTheme.productCard.addToCartButton.borderRadius
            }">
            <span class="btn-text">Agregar</span>
            <span class="btn-icon">+</span>
          </button>
          
          <div class="quantity-controls" *ngIf="getItemQuantityInCart(product.id) > 0" [ngStyle]="{
              'background-color': homeTheme.productCard.quantityControls.backgroundColor,
              'color': homeTheme.productCard.quantityControls.textColor,
              'font-size': homeTheme.productCard.quantityControls.fontSize
            }">
            <button class="quantity-btn decrease" (click)="decreaseQuantity(product)" [ngStyle]="{
              'background-color': homeTheme.productCard.quantityControls.decreaseColor
            }">
              <span>-</span>
            </button>
            <div class="quantity-display">
              {{ getItemQuantityInCart(product.id) }}
            </div>
            <button class="quantity-btn increase" (click)="addToCart(product)" [ngStyle]="{
              'background-color': homeTheme.productCard.quantityControls.increaseColor
            }">
              <span>+</span>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Espaciador para el carrito flotante -->
      <div class="product-card cart-spacer"></div>
    </div>
  </main>
</div>

<!-- Modal para detalles del producto -->
<app-modal
  [product]="selectedProduct"
  [isOpen]="showModal"
  [initialQuantity]="selectedProduct ? getItemQuantityInCart(selectedProduct.id) : 0"
  (close)="closeModal()"
  (addToCart)="handleAddToCartFromModal($event)"
></app-modal>
